<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1a1814"/>
<title>Daily Planner</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Daily%20Planner%22%2C%22short_name%22%3A%22Daily%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231a1814%22%2C%22theme_color%22%3A%22%231a1814%22%7D"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
html,body{margin:0;padding:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#1a1814;}
body{font-family:'Inter',system-ui,sans-serif;color:#e8dcc8;}
input,textarea,button,select{font-family:'Inter',system-ui,sans-serif;}
::-webkit-scrollbar{display:none;}
input[type="date"]{color-scheme:dark;}

@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(196,138,60,0.15)}50%{box-shadow:0 0 35px rgba(196,138,60,0.28)}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

:root{
  --bg:        #1a1814;
  --bg2:       #201e1a;
  --bg3:       #252220;
  --card:      #221f1b;
  --card2:     #2a2620;
  --border:    rgba(196,138,60,0.18);
  --border2:   rgba(255,255,255,0.06);
  --amber:     #c48a3c;
  --amber2:    #e8a84a;
  --amberSoft: rgba(196,138,60,0.12);
  --amberGlow: rgba(196,138,60,0.25);
  --cream:     #e8dcc8;
  --creamy:    #b8aa94;
  --muted:     #6b6254;
  --green:     #7ab87a;
  --greenSoft: rgba(122,184,122,0.12);
  --red:       #c47a6a;
  --redSoft:   rgba(196,122,106,0.12);
  --blue:      #7aaac4;
  --purple:    #a47ac4;
}

/* ── Card styles ── */
.card{
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:20px;
  overflow:hidden;
  transition:all 0.2s;
}
.card-amber{
  background:linear-gradient(135deg,rgba(196,138,60,0.14) 0%,rgba(32,28,22,0.9) 60%);
  border:1px solid var(--border);
  border-radius:20px;
}
.card-dark{
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:16px;
}

/* ── Amber shimmer text ── */
.amber-text{
  background:linear-gradient(90deg,#9a6828,#e8a84a,#c48a3c,#f0c060,#9a6828);
  background-size:250% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:shimmer 5s linear infinite;
}

/* ── Buttons ── */
.btn-primary{
  background:linear-gradient(135deg,#a87030,#e8a84a,#c48a3c);
  background-size:200% auto;
  border:none;color:#1a1410;font-weight:700;
  cursor:pointer;transition:all 0.25s;
  touch-action:manipulation;border-radius:14px;
}
.btn-primary:active{transform:scale(0.95);filter:brightness(0.9);}
.btn-secondary{
  background:var(--amberSoft);
  border:1px solid var(--border);
  color:var(--amber2);font-weight:600;
  cursor:pointer;transition:all 0.2s;
  touch-action:manipulation;border-radius:12px;
}
.btn-secondary:active{background:rgba(196,138,60,0.2);}
.btn-ghost{
  background:transparent;
  border:1px solid var(--border2);
  color:var(--creamy);font-weight:500;
  cursor:pointer;transition:all 0.2s;
  touch-action:manipulation;
}

/* ── Inputs ── */
input:not([type=date]):not([type=checkbox]),textarea{
  background:var(--bg2)!important;
  border:1px solid var(--border2)!important;
  border-radius:14px!important;
  color:var(--cream)!important;
  padding:13px 16px!important;
  font-size:14px!important;
  outline:none!important;
  transition:border-color 0.2s,box-shadow 0.2s!important;
  width:100%;
}
input:not([type=date]):not([type=checkbox]):focus,textarea:focus{
  border-color:var(--border)!important;
  box-shadow:0 0 0 3px rgba(196,138,60,0.08)!important;
}
input[type=date]{
  background:var(--bg2)!important;
  border:1px solid var(--border2)!important;
  border-radius:14px!important;
  color:var(--cream)!important;
  padding:13px 16px!important;
  font-size:14px!important;
  outline:none!important;
  width:100%;
}

/* ── Tab active glow ── */
.tab-active-line{
  height:2px;
  background:linear-gradient(90deg,transparent,var(--amber2),transparent);
  border-radius:2px;
  box-shadow:0 0 8px var(--amberGlow);
}

/* ── Checkbox ── */
.check-box{
  width:24px;height:24px;border-radius:8px;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,0.12);
  background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;touch-action:manipulation;
}
.check-box.done{
  background:var(--green);
  border-color:var(--green);
  box-shadow:0 0 10px rgba(122,184,122,0.35);
}
.check-box.routine-done{
  background:linear-gradient(135deg,var(--amber),var(--amber2));
  border-color:var(--amber2);
  box-shadow:0 0 8px rgba(196,138,60,0.4);
}

/* ── Progress bar ── */
.prog-track{height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width 0.5s cubic-bezier(.4,0,.2,1);}
.prog-amber{background:linear-gradient(90deg,#9a6828,#e8a84a);box-shadow:0 0 8px rgba(196,138,60,0.4);}
.prog-purple{background:linear-gradient(90deg,#7a5ca0,#c084fc);box-shadow:0 0 8px rgba(192,132,252,0.35);}
.prog-green{background:linear-gradient(90deg,#4a8a4a,#7ab87a);box-shadow:0 0 8px rgba(122,184,122,0.35);}

/* ── Section label ── */
.sec-label{
  font-size:9px;font-weight:700;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--muted);
  display:block;margin-bottom:10px;
}

/* Fade anim */
.fade-up{animation:fadeSlideUp 0.25s ease both;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const{useState,useRef,useEffect}=React;
const SK="dailyapp_v3";
const e=React.createElement;

// ── Tokens ─────────────────────────────────────────────────────────────────
const T={
  bg:"#1a1814",bg2:"#201e1a",bg3:"#252220",
  card:"#221f1b",card2:"#2a2620",
  border:"rgba(196,138,60,0.18)",border2:"rgba(255,255,255,0.06)",
  amber:"#c48a3c",amber2:"#e8a84a",amberSoft:"rgba(196,138,60,0.12)",amberGlow:"rgba(196,138,60,0.25)",
  cream:"#e8dcc8",creamy:"#b8aa94",muted:"#6b6254",
  green:"#7ab87a",greenSoft:"rgba(122,184,122,0.12)",
  red:"#c47a6a",redSoft:"rgba(196,122,106,0.12)",
  blue:"#7aaac4",purple:"#a47ac4",
};

const MOODS=["😞","😐","🙂","😊","🤩"];
const DS=["Su","Mo","Tu","We","Th","Fr","Sa"];
const ML=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const NC=["#c48a3c","#7ab87a","#7aaac4","#a47ac4","#c47a6a","#c4a03c"];

const toKey=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dy=String(d.getDate()).padStart(2,"0");return`${y}-${m}-${dy}`;};
const todayKey=()=>toKey(new Date());

// ── Storage ─────────────────────────────────────────────────────────────────
function useStorage(){
  const[store,setStore]=useState(()=>{try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{}}catch{return{}}});
  const save=ns=>{setStore(ns);try{localStorage.setItem(SK,JSON.stringify(ns))}catch{}};
  const getDay=k=>store.days?.[k]||{todos:[],note:"",mood:null};
  const setDay=(k,d)=>save({...store,days:{...store.days,[k]:d}});
  const routines=store.routines||{items:[],checks:{}};
  const setRoutines=r=>save({...store,routines:r});
  const notes=store.notes||[];
  const setNotes=n=>save({...store,notes:n});
  return{store,getDay,setDay,routines,setRoutines,notes,setNotes};
}

function getRng(s,e2){const k=[];const c=new Date(s+"T12:00:00");const ed=new Date(e2+"T12:00:00");while(c<=ed){k.push(toKey(c));c.setDate(c.getDate()+1);}return k;}
function dStat(days,key){const d=days?.[key]||{todos:[]};const done=d.todos.filter(t=>t.done).length;const total=d.todos.length;return{done,total,pct:total?Math.round((done/total)*100):0};}

// ── Shared UI ───────────────────────────────────────────────────────────────
function Divider(){return e("div",{style:{height:1,background:"linear-gradient(90deg,transparent,rgba(196,138,60,0.2),transparent)",margin:"2px 0"}});}

function PeriodPicker({value,onChange}){
  return e("div",{style:{display:"flex",background:T.bg2,borderRadius:14,padding:4,gap:2,border:"1px solid "+T.border2}},
    [["day","Day"],["week","Week"],["month","Month"],["year","Year"]].map(([id,lbl])=>
      e("button",{key:id,onClick:()=>onChange(id),
        className:value===id?"btn-primary":"",
        style:{flex:1,padding:"9px 4px",borderRadius:10,border:"none",fontFamily:"inherit",
          background:value===id?"":"transparent",
          color:value===id?T.bg:T.muted,
          fontWeight:value===id?700:500,fontSize:12,cursor:"pointer",
          transition:"all 0.2s",touchAction:"manipulation",letterSpacing:"0.03em"}},lbl)
    )
  );
}

function StatCard({label,value,color,icon}){
  return e("div",{className:"card-dark fade-up",style:{padding:"14px 12px",textAlign:"center",position:"relative",overflow:"hidden",borderRadius:16}},
    e("div",{style:{position:"absolute",top:-8,right:-4,fontSize:30,opacity:0.06,lineHeight:1}},icon||"●"),
    e("div",{style:{fontSize:20,fontWeight:800,color,letterSpacing:"-0.03em",fontFamily:"'Cormorant Garamond',serif",lineHeight:1.1}},value),
    e("div",{style:{fontSize:9,color:T.muted,marginTop:6,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase"}},label)
  );
}

function BarChart({bars,height=80,barCol}){
  const mx=Math.max(...bars.map(b=>b.total),1);
  return e("div",{style:{display:"flex",alignItems:"flex-end",gap:6,height}},
    bars.map((b,i)=>{
      const h=Math.max((b.total/mx)*(height-20),b.total>0?5:2);
      const dh=Math.max((b.done/mx)*(height-20),b.done>0?3:0);
      return e("div",{key:i,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}},
        e("div",{style:{width:"100%",display:"flex",alignItems:"flex-end",height:height-20}},
          e("div",{style:{position:"relative",width:"100%",height:h,borderRadius:"6px 6px 3px 3px",background:"rgba(255,255,255,0.05)",overflow:"hidden"}},
            e("div",{style:{position:"absolute",bottom:0,width:"100%",height:dh,background:barCol||`linear-gradient(0deg,${T.amber},${T.amber2})`,borderRadius:"4px 4px 0 0"}})
          )
        ),
        e("span",{style:{fontSize:9,color:b.highlight?T.amber2:T.muted,fontWeight:b.highlight?700:400,letterSpacing:"0.04em"}},b.label)
      );
    })
  );
}

function MiniBar({label,value,max,color}){
  const pct=max?(value/max)*100:0;
  return e("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
    e("span",{style:{color:T.creamy,fontSize:11,width:34,textAlign:"right",flexShrink:0,fontWeight:500}},label),
    e("div",{style:{flex:1,height:5,background:"rgba(255,255,255,0.05)",borderRadius:99,overflow:"hidden"}},
      e("div",{style:{width:`${pct}%`,height:"100%",borderRadius:99,background:color,transition:"width 0.6s cubic-bezier(.4,0,.2,1)"}})
    ),
    e("span",{style:{color:T.cream,fontSize:11,width:28,textAlign:"right",fontWeight:700}},value+"%")
  );
}

function CircleChart({pct,size=92,color,label,sublabel}){
  const r=(size-14)/2;const circ=2*Math.PI*r;
  const dash=(pct/100)*circ;const gap=circ-dash;
  return e("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:5}},
    e("div",{style:{position:"relative",width:size,height:size}},
      e("svg",{width:size,height:size,style:{transform:"rotate(-90deg)"}},
        e("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:"rgba(255,255,255,0.05)",strokeWidth:8}),
        e("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:color,strokeWidth:8,
          strokeDasharray:`${dash} ${gap}`,strokeLinecap:"round",
          style:{transition:"stroke-dasharray 0.7s cubic-bezier(.4,0,.2,1)",
            filter:`drop-shadow(0 0 5px ${color}88)`}})
      ),
      e("div",{style:{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}},
        e("span",{style:{fontSize:14,fontWeight:800,color,fontFamily:"'Cormorant Garamond',serif",letterSpacing:"-0.01em"}},pct+"%")
      )
    ),
    label&&e("span",{style:{fontSize:10,fontWeight:600,color:T.creamy,letterSpacing:"0.04em"}},label),
    sublabel&&e("span",{style:{fontSize:9,color:T.muted}},sublabel)
  );
}

// ── Calendar ─────────────────────────────────────────────────────────────────
function CalendarPicker({selected,onSelect,days}){
  const init=selected?new Date(selected+"T12:00:00"):new Date();
  const[view,setView]=useState({year:init.getFullYear(),month:init.getMonth()});
  const fDay=new Date(view.year,view.month,1).getDay();
  const dim=new Date(view.year,view.month+1,0).getDate();
  const cells=Array.from({length:fDay+dim},(_,i)=>i<fDay?null:new Date(view.year,view.month,i-fDay+1));
  while(cells.length%7!==0)cells.push(null);
  const prev=()=>setView(v=>{const d=new Date(v.year,v.month-1);return{year:d.getFullYear(),month:d.getMonth()};});
  const next=()=>setView(v=>{const d=new Date(v.year,v.month+1);return{year:d.getFullYear(),month:d.getMonth()};});
  const tk=todayKey();

  return e("div",{className:"card",style:{padding:"18px 14px"}},
    // Month nav
    e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}},
      e("button",{onClick:prev,style:{width:32,height:32,borderRadius:10,background:T.bg2,border:"1px solid "+T.border2,color:T.creamy,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",touchAction:"manipulation",fontFamily:"inherit"}},"‹"),
      e("div",{style:{textAlign:"center"}},
        e("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontWeight:700,fontSize:18,color:T.cream,letterSpacing:"0.02em"}},ML[view.month]),
        e("div",{style:{fontSize:10,color:T.muted,marginTop:1,letterSpacing:"0.1em",fontWeight:600}},""+view.year)
      ),
      e("button",{onClick:next,style:{width:32,height:32,borderRadius:10,background:T.bg2,border:"1px solid "+T.border2,color:T.creamy,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",touchAction:"manipulation",fontFamily:"inherit"}},"›")
    ),
    // Headers
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:8}},
      DS.map(d=>e("div",{key:d,style:{textAlign:"center",fontSize:9,color:T.muted,fontWeight:700,letterSpacing:"0.08em",paddingBottom:6}},d))
    ),
    e(Divider,null),
    e("div",{style:{height:10}}),
    // Cells
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}},
      cells.map((date,i)=>{
        if(!date)return e("div",{key:i});
        const k=toKey(date);const isToday=k===tk;const isSel=k===selected;
        const dd=days?.[k];const ht=dd?.todos?.length>0;
        const allDone=ht&&dd.todos.every(t=>t.done);
        const someDone=ht&&!allDone&&dd.todos.some(t=>t.done);
        const dotCol=allDone?T.green:someDone?T.amber2:ht?"rgba(255,255,255,0.2)":null;
        return e("button",{key:k,onClick:()=>onSelect(k),style:{
          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
          padding:"7px 2px",borderRadius:10,border:"none",touchAction:"manipulation",
          background:isSel?`linear-gradient(135deg,${T.amber},${T.amber2})`:isToday?"rgba(196,138,60,0.12)":"transparent",
          boxShadow:isSel?"0 4px 14px rgba(196,138,60,0.3)":"none",
          outline:isToday&&!isSel?"1.5px solid rgba(196,138,60,0.35)":"none",
          outlineOffset:"-1px",transition:"all 0.15s",
        }},
          e("span",{style:{fontSize:13,fontWeight:isSel||isToday?700:400,lineHeight:1,color:isSel?"#1a1410":isToday?T.amber2:T.cream}},date.getDate()),
          dotCol?e("span",{style:{width:4,height:4,borderRadius:"50%",background:isSel?"rgba(26,20,16,0.6)":dotCol,marginTop:3,display:"block"}}):e("span",{style:{width:4,height:4,marginTop:3,display:"block"}})
        );
      })
    )
  );
}

// ── Todo Tab ──────────────────────────────────────────────────────────────────
function TodoTab({selectedDate,day,onUpdate,days,onSelectDate}){
  const[input,setInput]=useState("");
  const inputRef=useRef();
  const isToday=selectedDate===todayKey();
  const add=()=>{const t=input.trim();if(!t)return;onUpdate({...day,todos:[...day.todos,{id:Date.now(),text:t,done:false}]});setInput("");inputRef.current?.focus();};
  const toggle=id=>onUpdate({...day,todos:day.todos.map(t=>t.id===id?{...t,done:!t.done}:t)});
  const remove=id=>onUpdate({...day,todos:day.todos.filter(t=>t.id!==id)});
  const done=day.todos.filter(t=>t.done).length;const total=day.todos.length;const pct=total?Math.round((done/total)*100):0;
  const dispDate=new Date(selectedDate+"T12:00:00").toLocaleDateString("en",{weekday:"long",month:"short",day:"numeric"});

  return e("div",{style:{display:"flex",flexDirection:"column",gap:14}},
    e(CalendarPicker,{selected:selectedDate,onSelect:onSelectDate,days}),

    // Date label
    e("div",{className:"card-amber",style:{padding:"13px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",borderRadius:16}},
      e("div",null,
        e("div",{style:{fontSize:9,color:T.muted,textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:700}},isToday?"Today":"Selected Date"),
        e("div",{style:{fontSize:15,fontWeight:700,color:isToday?T.amber2:T.cream,marginTop:3,letterSpacing:"-0.01em"}},isToday?"📌 "+dispDate:"📅 "+dispDate)
      ),
      !isToday&&e("button",{className:"btn-secondary",onClick:()=>onSelectDate(todayKey()),style:{padding:"7px 14px",fontSize:12}},"Today →")
    ),

    // Progress card
    total>0&&e("div",{className:"card",style:{padding:"14px 16px"}},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
        e("div",null,
          e("div",{style:{fontSize:10,color:T.muted,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase"}},"Progress"),
          e("div",{style:{fontSize:13,color:T.creamy,marginTop:2,fontWeight:500}},`${done} of ${total} tasks`)
        ),
        e("div",{className:"amber-text",style:{fontSize:24,fontWeight:800,fontFamily:"'Cormorant Garamond',serif",letterSpacing:"-0.02em"}},pct+"%")
      ),
      e("div",{className:"prog-track"},e("div",{className:"prog-fill prog-amber",style:{width:`${pct}%`}}))
    ),

    // Input row
    e("div",{style:{display:"flex",gap:10}},
      e("input",{ref:inputRef,value:input,onChange:ev=>setInput(ev.target.value),onKeyDown:ev=>ev.key==="Enter"&&add(),placeholder:isToday?"Add a task for today…":"Add task…",style:{flex:1}}),
      e("button",{className:"btn-primary",onClick:add,style:{width:50,height:50,fontSize:22,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},"+")
    ),

    // Task list
    e("div",{style:{display:"flex",flexDirection:"column",gap:8}},
      total===0&&e("div",{className:"card",style:{padding:"28px 16px",textAlign:"center"}},
        e("div",{style:{fontSize:32,opacity:0.4,marginBottom:8}},"◈"),
        e("div",{style:{color:T.muted,fontSize:13,letterSpacing:"0.03em"}},"No tasks yet")
      ),
      ...day.todos.map(t=>
        e("div",{key:t.id,className:"card fade-up",style:{padding:"13px 16px",display:"flex",alignItems:"center",gap:12,background:t.done?"rgba(122,184,122,0.07)":"#221f1b",borderColor:t.done?"rgba(122,184,122,0.2)":T.border2}},
          e("button",{onClick:()=>toggle(t.id),className:"check-box"+(t.done?" done":""),style:{}},
            t.done&&e("span",{style:{color:"#1a1814",fontSize:13,fontWeight:800,lineHeight:1}},"✓")
          ),

// ── Summary Checklist ─────────────────────────────────────────────────────────
function SummaryChecklistTab({days}){
  const[period,setPeriod]=useState("week");
  const tk=todayKey();const now=new Date();
  const wStart=new Date(now);wStart.setDate(now.getDate()-now.getDay());
  const wKeys=Array.from({length:7},(_,i)=>{const d=new Date(wStart);d.setDate(wStart.getDate()+i);return toKey(d);});
  const mKeys=getRng(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-01`,tk);
  const mW=[];let w=[];mKeys.forEach((k,i)=>{w.push(k);if(w.length===7||i===mKeys.length-1){mW.push([...w]);w=[];}});
  const sum=keys=>{const done=keys.reduce((a,k)=>a+dStat(days,k).done,0);const total=keys.reduce((a,k)=>a+dStat(days,k).total,0);return{done,total,pct:total?Math.round((done/total)*100):0};};
  const dS=dStat(days,tk);const wS=sum(wKeys);const mS=sum(mKeys);
  const yKeys=getRng(`${now.getFullYear()}-01-01`,tk);const yS=sum(yKeys);
  const wBars=wKeys.map((k,i)=>{const s=dStat(days,k);return{label:DS[i],done:s.done,total:s.total,highlight:k===tk};});
  const mBars=mW.map((wk,i)=>{const s=sum(wk);return{label:`W${i+1}`,done:s.done,total:s.total,highlight:i===mW.length-1};});

  const rc=b=>b.total?(Math.round((b.done/b.total)*100)>=80?T.green:Math.round((b.done/b.total)*100)>=40?T.amber2:T.red):T.muted;

    month:{label:ML[now.getMonth()],s:mS,bars:mBars,ct:"By week — "+MS[now.getMonth()],rBars:mKeys.slice(-10).map(k=>{const s=dStat(days,k);return{label:""+new Date(k+"T12:00:00").getDate(),pct:s.pct,color:s.total?(s.pct>=80?T.green:s.pct>=40?T.amber2:T.red):T.muted};})},

  };
  const cfg=cfgs[period];

    e("div",{className:"card-amber",style:{padding:"14px 18px",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"space-between"}},
      e("div",null,
        e("div",{className:"sec-label",style:{marginBottom:3}},"Period"),

    ),

      e(StatCard,{label:"Total",value:cfg.s.total,color:T.amber2,icon:"◆"}),

    ),

      e("div",{className:"sec-label"},cfg.ct),

      e("div",{style:{display:"flex",gap:14,marginTop:12}},
        e("span",{style:{fontSize:10,color:T.muted,display:"flex",alignItems:"center",gap:5}},e("span",{style:{width:8,height:8,background:"rgba(255,255,255,0.06)",borderRadius:2,display:"inline-block"}}),"Total"),
        e("span",{style:{fontSize:10,color:T.amber2,display:"flex",alignItems:"center",gap:5}},e("span",{style:{width:8,height:8,background:T.amber2,borderRadius:2,display:"inline-block"}}),"Done")

  const wStart=new Date(now);wStart.setDate(now.getDate()-now.getDay());

  const yKeys=getRng(`${now.getFullYear()}-01-01`,tk);
  const pKeys={day:[tk],week:wKeys,month:mKeys,year:yKeys}[period];
  const pLabel={day:"Today",week:"This Week",month:ML[now.getMonth()],year:""+now.getFullYear()}[period];
  const totalP=items.length*pKeys.length;
  const totalD=items.reduce((a,item)=>a+getCC(item.id,pKeys),0);
  const ovPct=totalP?Math.round((totalD/totalP)*100):0;
  const perfDays=pKeys.filter(k=>items.length>0&&items.every(item=>checks[k]?.[item.id])).length;
  const iStats=items.map(item=>({...item,done:getCC(item.id,pKeys),pct:pKeys.length?Math.round((getCC(item.id,pKeys)/pKeys.length)*100):0}));
  let bars=[];
  if(period==="day"||period==="week"){bars=wKeys.map((k,i)=>({label:DS[i],done:items.filter(item=>checks[k]?.[item.id]).length,total:items.length,highlight:k===tk}));}
  else if(period==="month"){const mW2=[];let ww=[];mKeys.forEach((k,i)=>{ww.push(k);if(ww.length===7||i===mKeys.length-1){mW2.push([...ww]);ww=[];}});bars=mW2.map((wk,i)=>{const done=wk.reduce((a,k)=>a+items.filter(item=>checks[k]?.[item.id]).length,0);return{label:`W${i+1}`,done,total:items.length*wk.length,highlight:i===mW2.length-1};});}
  else{bars=Array.from({length:12},(_,i)=>{const mS=`${now.getFullYear()}-${String(i+1).padStart(2,"0")}-01`;const mE=toKey(new Date(now.getFullYear(),i+1,0));const ee=mE>tk?tk:mE;if(mS>tk)return{label:MS[i],done:0,total:0,highlight:false};const mk=getRng(mS,ee);const done=mk.reduce((a,k)=>a+items.filter(item=>checks[k]?.[item.id]).length,0);return{label:MS[i],done,total:items.length*mk.length,highlight:i===now.getMonth()};});}
  const RCOLS=[T.amber2,T.green,T.blue,T.purple];
  if(items.length===0)return e("div",{style:{display:"flex",flexDirection:"column",gap:14}},
    e(PeriodPicker,{value:period,onChange:setPeriod}),
    e("div",{className:"card",style:{padding:"32px 16px",textAlign:"center"}},
      e("div",{style:{fontSize:30,opacity:0.3,marginBottom:8}},"🏅"),
      e("div",{style:{color:T.muted,fontSize:13}},"Add routines first")
    )
  );
  return e("div",{style:{display:"flex",flexDirection:"column",gap:14}},
    e(PeriodPicker,{value:period,onChange:setPeriod}),
    e("div",{className:"card-amber",style:{padding:"14px 18px",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"space-between"}},
      e("div",null,
        e("div",{className:"sec-label",style:{marginBottom:3}},"Period"),
        e("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontWeight:700,fontSize:22,color:T.cream}},pLabel)
      ),
      e("div",{className:"amber-text",style:{fontFamily:"'Cormorant Garamond',serif",fontWeight:700,fontSize:36,letterSpacing:"-0.02em"}},ovPct+"%")
    ),
    e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}},
      e(StatCard,{label:"Completed",value:totalD,color:T.purple,icon:"◉"}),
      e(StatCard,{label:"Rate",value:`${ovPct}%`,color:T.green,icon:"△"}),
      e(StatCard,{label:"⭐ Days",value:perfDays,color:T.amber2,icon:"★"})
    ),
    e("div",{className:"card",style:{padding:16}},
      e("div",{className:"sec-label"},"Routine Completion"),
      e("div",{style:{display:"flex",justifyContent:"space-around",flexWrap:"wrap",gap:14,paddingTop:4}},
        iStats.slice(0,4).map((item,i)=>e(CircleChart,{key:item.id,pct:item.pct,color:RCOLS[i%4],label:item.title.length>9?item.title.slice(0,9)+"…":item.title,sublabel:`${item.done}/${pKeys.length}d`}))
      )
    ),
    e("div",{className:"card",style:{padding:16}},
      e("div",{className:"sec-label"},`By ${period==="year"?"Month":period==="month"?"Week":"Day"}`),
      e(BarChart,{bars,height:90,barCol:`linear-gradient(0deg,${T.purple},#c084fc)`}),
      e("div",{style:{display:"flex",gap:14,marginTop:12}},
        e("span",{style:{fontSize:10,color:T.muted,display:"flex",alignItems:"center",gap:5}},e("span",{style:{width:8,height:8,background:"rgba(255,255,255,0.05)",borderRadius:2,display:"inline-block"}}),"Possible"),
        e("span",{style:{fontSize:10,color:T.purple,display:"flex",alignItems:"center",gap:5}},e("span",{style:{width:8,height:8,background:T.purple,borderRadius:2,display:"inline-block"}}),"Done")
      )
    ),
    e("div",{className:"card",style:{padding:16}},
      e("div",{className:"sec-label"},"Per Routine Rate"),
      iStats.map((item,i)=>e(MiniBar,{key:item.id,label:item.title.length>8?item.title.slice(0,8)+"…":item.title,value:item.pct,max:100,color:RCOLS[i%4]}))
    )
  );
}

// ── App Root ──────────────────────────────────────────────────────────────────
// ── Settings / Backup Tab ─────────────────────────────────────────────────────
function SettingsTab(){
  const[msg,setMsg]=useState(null);
  const[confirmClear,setConfirmClear]=useState(false);
  const fileInputRef=useRef();

  const showMsg=(text,color)=>{setMsg({text,color});setTimeout(()=>setMsg(null),3500);};

  // Get storage stats
  const getStats=()=>{
    try{
      const raw=localStorage.getItem(SK);
      if(!raw)return{size:0,days:0,notes:0,routines:0};
      const data=JSON.parse(raw);
      const sizeKB=(new Blob([raw]).size/1024).toFixed(1);
      return{
        size:sizeKB,
        days:Object.keys(data.days||{}).length,
        notes:(data.notes||[]).length,
        routines:(data.routines?.items||[]).length,
      };
    }catch{return{size:0,days:0,notes:0,routines:0};}
  };
  const stats=getStats();

  // ── Export ──
  const exportData=()=>{
    try{
      const raw=localStorage.getItem(SK)||"{}";
      const data=JSON.parse(raw);
      const backup={
        version:"1.0",
        exportedAt:new Date().toISOString(),
        appName:"Daily Planner",
        data,
      };
      const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      const today=todayKey();
      a.href=url;
      a.download=`daily-planner-backup-${today}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showMsg("✓ Backup downloaded to your phone",T.green);
    }catch(err){
      showMsg("✗ Export failed: "+err.message,T.red);
    }
  };

  // ── Import ──
  const importData=(event)=>{
    const file=event.target.files?.[0];
    if(!file){return;}
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        // Accept either the wrapped backup format or raw data
        const data=parsed.data||parsed;
        if(typeof data!=="object"||data===null){
          throw new Error("Invalid backup file");
        }
        localStorage.setItem(SK,JSON.stringify(data));
        showMsg("✓ Backup restored! Reloading…",T.green);
        setTimeout(()=>window.location.reload(),1200);
      }catch(err){
        showMsg("✗ Import failed: not a valid backup file",T.red);
      }
    };
    reader.readAsText(file);
    event.target.value="";
  };

  // ── Clear ──
  const clearAll=()=>{
    localStorage.removeItem(SK);
    showMsg("All data cleared. Reloading…",T.amber2);
    setTimeout(()=>window.location.reload(),1200);
  };

  // ── Share (uses Web Share API if available) ──
  const shareData=async()=>{
    try{
      const raw=localStorage.getItem(SK)||"{}";
      const backup={version:"1.0",exportedAt:new Date().toISOString(),appName:"Daily Planner",data:JSON.parse(raw)};
      const file=new File([JSON.stringify(backup,null,2)],`daily-planner-backup-${todayKey()}.json`,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:"Daily Planner Backup"});
        showMsg("✓ Shared",T.green);
      }else{
        exportData();
      }
    }catch(err){
      if(err.name!=="AbortError")showMsg("✗ Share failed",T.red);
    }
  };

  return e("div",{style:{display:"flex",flexDirection:"column",gap:14}},

    // Storage stats
    e("div",{className:"card-amber",style:{padding:"18px",borderRadius:18}},
      e("div",{style:{fontSize:9,color:T.muted,textTransform:"uppercase",letterSpacing:"0.14em",fontWeight:700,marginBottom:10}},"Storage"),
      e("div",{style:{display:"flex",alignItems:"baseline",gap:6,marginBottom:12}},
        e("span",{className:"amber-text",style:{fontFamily:"'Cormorant Garamond',serif",fontWeight:700,fontSize:30,letterSpacing:"-0.02em"}},stats.size),
        e("span",{style:{color:T.creamy,fontSize:13,fontWeight:600}},"KB used")
      ),
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}},
        e("div",{style:{textAlign:"center"}},
          e("div",{style:{fontSize:18,fontWeight:800,color:T.cream,fontFamily:"'Cormorant Garamond',serif"}},stats.days),
          e("div",{style:{fontSize:10,color:T.muted,marginTop:2,letterSpacing:"0.05em"}},"Days")
        ),
        e("div",{style:{textAlign:"center"}},
          e("div",{style:{fontSize:18,fontWeight:800,color:T.cream,fontFamily:"'Cormorant Garamond',serif"}},stats.notes),
          e("div",{style:{fontSize:10,color:T.muted,marginTop:2,letterSpacing:"0.05em"}},"Notes")
        ),
        e("div",{style:{textAlign:"center"}},
          e("div",{style:{fontSize:18,fontWeight:800,color:T.cream,fontFamily:"'Cormorant Garamond',serif"}},stats.routines),
          e("div",{style:{fontSize:10,color:T.muted,marginTop:2,letterSpacing:"0.05em"}},"Routines")
        )
      )
    ),

    // Message banner
    msg&&e("div",{style:{
      padding:"12px 16px",borderRadius:12,
      background:msg.color+"22",
      border:"1px solid "+msg.color+"44",
      color:msg.color,fontSize:13,fontWeight:600,textAlign:"center",
    }},msg.text),

    // Backup section
    e("div",{className:"card",style:{padding:16}},
      e("div",{className:"sec-label"},"💾 Backup"),
      e("p",{style:{color:T.creamy,fontSize:13,lineHeight:1.6,margin:"0 0 14px"}},
        "Download all your data as a JSON file. Save it somewhere safe — Google Drive, email it to yourself, etc."
      ),
      e("div",{style:{display:"flex",flexDirection:"column",gap:8}},
        e("button",{className:"btn-primary",onClick:exportData,style:{padding:"13px 16px",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:8}},
          e("span",null,"⬇"),e("span",null,"Download Backup File")
        ),
        navigator.share&&e("button",{className:"btn-secondary",onClick:shareData,style:{padding:"12px 16px",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:8}},
          e("span",null,"📤"),e("span",null,"Share Backup")
        )
      )
    ),

    // Restore section
    e("div",{className:"card",style:{padding:16}},
      e("div",{className:"sec-label"},"♻ Restore"),
      e("p",{style:{color:T.creamy,fontSize:13,lineHeight:1.6,margin:"0 0 14px"}},
        e("span",{style:{color:T.amber2,fontWeight:600}},"Warning: "),
        "This will replace ALL your current data with the backup file."
      ),
      e("input",{ref:fileInputRef,type:"file",accept:".json,application/json",onChange:importData,style:{display:"none"}}),
      e("button",{className:"btn-secondary",onClick:()=>fileInputRef.current?.click(),style:{padding:"13px 16px",fontSize:14,width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8}},
        e("span",null,"⬆"),e("span",null,"Choose Backup File")
      )
    ),

    // Clear data section
    e("div",{className:"card",style:{padding:16}},
      e("div",{className:"sec-label",style:{color:T.red+"AA"}},"⚠ Danger Zone"),
      e("p",{style:{color:T.creamy,fontSize:13,lineHeight:1.6,margin:"0 0 14px"}},
        "Permanently delete all data on this device. This cannot be undone."
      ),
      !confirmClear
      ?e("button",{onClick:()=>setConfirmClear(true),style:{background:T.redSoft,border:"1px solid "+T.red+"33",color:T.red,padding:"12px 16px",fontSize:13,fontWeight:600,borderRadius:12,cursor:"pointer",width:"100%",fontFamily:"inherit",touchAction:"manipulation"}},"🗑 Clear All Data")
      :e("div",{style:{display:"flex",gap:8}},
          e("button",{onClick:clearAll,style:{flex:1,background:T.red,border:"none",color:"#fff",padding:"12px 0",fontSize:13,fontWeight:700,borderRadius:12,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}},"Yes, Delete All"),
          e("button",{onClick:()=>setConfirmClear(false),className:"btn-ghost",style:{flex:1,padding:"12px 0",fontSize:13,fontWeight:600,borderRadius:12}},"Cancel")
        )
    ),

    // Info
    e("div",{style:{padding:"14px 16px",fontSize:11,color:T.muted,textAlign:"center",lineHeight:1.6}},
      e("div",null,"All data stays on your phone."),
      e("div",{style:{marginTop:2}},"Nothing is sent to any server.")
    ),

    e("div",{style:{height:40}})
  );
}

function App(){
  const{store,getDay,setDay,routines,setRoutines,notes,setNotes}=useStorage();
  const days=store.days||{};
  const[tab,setTab]=useState("todo");
  const[selectedDate,setSelectedDate]=useState(todayKey());
  const todayDay=getDay(todayKey());
  const day=getDay(selectedDate);
  const update=d=>setDay(selectedDate,d);
  const updateToday=d=>setDay(todayKey(),d);
  const now=new Date();
  const todayLabel=now.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"});
  const tdDone=todayDay.todos.filter(t=>t.done).length;
  const tdTotal=todayDay.todos.length;
  const rtDone=routines.items.filter(item=>routines.checks?.[todayKey()]?.[item.id]).length;

  const tabs=[
    {id:"todo",label:"Checklist",icon:"☑"},
    {id:"note",label:"Notes",icon:"📝"},
    {id:"routine",label:"Routine",icon:"🔁"},
    {id:"summary",label:"Summary",icon:"📊"},
    {id:"sumrout",label:"Rtn Sum",icon:"🏅"},
    {id:"settings",label:"Backup",icon:"⚙"},
  ];

  return e("div",{style:{minHeight:"100vh",background:T.bg,maxWidth:430,margin:"0 auto",display:"flex",flexDirection:"column",fontFamily:"'Inter',system-ui,sans-serif",position:"relative"}},

    // Ambient glow top
    e("div",{style:{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",width:300,height:200,background:"radial-gradient(ellipse,rgba(196,138,60,0.07) 0%,transparent 70%)",pointerEvents:"none",zIndex:0}}),

    // ── Header ──
    e("div",{style:{
      background:"linear-gradient(180deg,rgba(30,26,20,0.98) 0%,rgba(26,24,20,0.95) 100%)",
      padding:"max(env(safe-area-inset-top),22px) 18px 14px",
      borderBottom:"1px solid rgba(196,138,60,0.12)",
      position:"sticky",top:0,zIndex:20,
      backdropFilter:"blur(24px)",WebkitBackdropFilter:"blur(24px)",
    }},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}},
        e("div",{style:{flex:1,minWidth:0}},
          e("div",{style:{fontSize:9,color:T.muted,letterSpacing:"0.2em",textTransform:"uppercase",fontWeight:700,marginBottom:3}},"Daily Planner"),
          e("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontWeight:600,fontSize:17,color:T.cream,letterSpacing:"0.01em",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},todayLabel)
        ),
        e("div",{style:{display:"flex",gap:8,flexShrink:0}},
          e("div",{style:{background:"rgba(196,138,60,0.08)",border:"1px solid rgba(196,138,60,0.2)",borderRadius:13,padding:"7px 12px",textAlign:"center",minWidth:52}},
            e("div",{className:"amber-text",style:{fontSize:15,fontWeight:800,fontFamily:"'Cormorant Garamond',serif",letterSpacing:"-0.02em"}},`${tdDone}/${tdTotal}`),
            e("div",{style:{fontSize:8,color:T.muted,marginTop:1,letterSpacing:"0.1em",fontWeight:600,textTransform:"uppercase"}},"Tasks")
          ),
          e("div",{style:{background:"rgba(164,122,196,0.08)",border:"1px solid rgba(164,122,196,0.2)",borderRadius:13,padding:"7px 12px",textAlign:"center",minWidth:52}},
            e("div",{style:{fontSize:15,fontWeight:800,color:T.purple,fontFamily:"'Cormorant Garamond',serif",letterSpacing:"-0.02em"}},`${rtDone}/${routines.items.length}`),
            e("div",{style:{fontSize:8,color:T.muted,marginTop:1,letterSpacing:"0.1em",fontWeight:600,textTransform:"uppercase"}},"Routine")
          )
        )
      )
    ),

    // ── Tab Bar ──
    e("div",{style:{
      display:"flex",
      background:"rgba(26,24,20,0.96)",
      borderBottom:"1px solid rgba(255,255,255,0.05)",
      position:"sticky",top:0,zIndex:19,
      overflowX:"auto",
      backdropFilter:"blur(24px)",WebkitBackdropFilter:"blur(24px)",
    }},
      tabs.map(t=>e("div",{key:t.id,style:{flexShrink:0,minWidth:68,display:"flex",flexDirection:"column",alignItems:"center",cursor:"pointer",touchAction:"manipulation"},onClick:()=>setTab(t.id)},
        e("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"11px 6px 9px",width:"100%"}},
          e("span",{style:{fontSize:16,filter:tab===t.id?"drop-shadow(0 0 5px rgba(196,138,60,0.6))":"none",transition:"filter 0.3s"}},t.icon),
          e("span",{style:{fontSize:10,color:tab===t.id?T.amber2:T.muted,fontWeight:tab===t.id?700:400,letterSpacing:"0.02em",transition:"color 0.2s"}},t.label)
        ),
        tab===t.id&&e("div",{className:"tab-active-line",style:{width:"60%",marginBottom:0}})
      ))
    ),

    // ── Content ──
    e("div",{style:{flex:1,padding:16,overflowY:"auto",paddingBottom:"max(env(safe-area-inset-bottom),20px)",position:"relative",zIndex:1}},
      tab==="todo"&&e(TodoTab,{selectedDate,day,onUpdate:update,days,onSelectDate:setSelectedDate}),
      tab==="note"&&e(NotesTab,{notes,setNotes,todayDay,updateToday}),
      tab==="routine"&&e(RoutineTab,{routines,setRoutines}),
      tab==="summary"&&e(SummaryChecklistTab,{days}),
      tab==="sumrout"&&e(SummaryRoutineTab,{routines}),
      tab==="settings"&&e(SettingsTab,null)
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));

if("serviceWorker"in navigator){
  const c=`const V="daily-v3";self.addEventListener("install",e=>e.waitUntil(caches.open(V).then(c=>c.addAll(["."]))));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([c],{type:"application/javascript"}))).catch(()=>{});
}
